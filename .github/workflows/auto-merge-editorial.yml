name: Auto-merge editorial branches into main

# The sbh-editorial routine runs in Claude Code cloud sessions that can only
# push to their own claude/* branch. Before this workflow existed, a human had
# to open + merge a PR for every article — and the branches piled up conflicts.
#
# This workflow watches pushes to claude/* branches. If the branch's diff vs
# main touches ONLY editorial content (editorial/**), it merges the branch into
# main automatically. Conflicting hunks (typically the tracking checklists in
# editorial/topics-backlog.md) are resolved in favor of the branch (-X theirs),
# which carries the freshest tracking state for its own article.
#
# If the branch touches ANYTHING outside editorial/ (app code, workflows,
# sbh-cms…), it is NOT auto-merged — open a PR and review it like normal code.
#
# The push to main below uses GITHUB_TOKEN, which deliberately does NOT
# re-trigger the import-editorial-post.yml workflow: the Sanity import already
# ran on the claude/* branch push itself, so nothing gets imported twice.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'editorial/**'

concurrency:
  group: auto-merge-editorial-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the branch only touches editorial content
        id: guard
        run: |
          set -euo pipefail
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "::notice::Branch has no changes vs main — nothing to merge."
            echo "safe=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files changed vs main:"
          echo "$CHANGED"
          NON_EDITORIAL=$(echo "$CHANGED" | grep -v '^editorial/' || true)
          if [ -n "$NON_EDITORIAL" ]; then
            echo "::notice::Branch touches non-editorial files — auto-merge skipped, open a PR for review:"
            echo "$NON_EDITORIAL"
            echo "safe=no" >> "$GITHUB_OUTPUT"
          else
            echo "safe=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into main (favor branch on conflicts)
        if: steps.guard.outputs.safe == 'yes'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_SHA="${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            if git merge --no-ff -X theirs "$HEAD_SHA" \
                 -m "auto-merge(editorial): ${BRANCH} → main"; then
              if git push origin main; then
                echo "::notice::Auto-merged ${BRANCH} into main (attempt ${attempt})."
                exit 0
              fi
              echo "Push race detected, retrying (${attempt}/3)…"
              sleep 5
            else
              git merge --abort || true
              echo "::error::Merge of ${BRANCH} into main failed even with -X theirs. Manual merge required."
              exit 1
            fi
          done
          echo "::error::Could not push main after 3 attempts (concurrent pushes). Re-run this workflow."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Auto-merge editorial"
            echo ""
            case "${{ steps.guard.outputs.safe }}" in
              yes)  echo "✅ Branch \`${GITHUB_REF_NAME}\` merged into \`main\` automatically." ;;
              no)   echo "⚠️ Branch touches non-editorial files — merge it via a normal PR." ;;
              skip) echo "ℹ️ No changes vs main — nothing to do." ;;
              *)    echo "❓ Guard step did not run." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
