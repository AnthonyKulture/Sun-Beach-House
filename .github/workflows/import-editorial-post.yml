name: Editorial pipeline (import to Sanity, then merge to main)

# The whole path from "the routine pushed an article" to "it is live on the site",
# in two sequenced jobs:
#
#   1. import     — imports each changed post.json into Sanity in PUBLISHED state.
#                   The site only shows a post once its publishedAt date is reached
#                   (services/cms.ts filters publishedAt <= now()), so publishing
#                   early is how scheduling works. A post that still carries
#                   [À VÉRIFIER] markers is imported as a DRAFT instead, for a human
#                   to review and Publish in Studio.
#   2. auto-merge — merges the routine's editorial-only branch into main, but only
#                   once the import succeeded.
#
# Both jobs live in one workflow on purpose. They used to be two workflows on the
# same push trigger: they raced, and a merge that landed first moved main out from
# under the import's file detection, which then found nothing to import.
#
# Required GitHub Secrets:
#   SANITY_WRITE_TOKEN — Editor role token from https://www.sanity.io/manage
#   GEMINI_API_KEY     — Google AI Studio key ("AIza…") for Gemini image generation (optional;
#                        posts import without mainImage if the secret is absent or generation fails)

on:
  push:
    branches: [main, 'claude/**']
    # Deliberately wider than post.json: a branch push carrying only the backlog
    # update still has to reach the auto-merge job. The import job treats "no
    # post.json changed" as a no-op.
    paths:
      - 'editorial/**'
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to post.json (e.g. editorial/posts/my-slug/post.json)'
        required: true
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history: the detection step below diffs against github.event.before
          # and against origin/main. With a shallow clone those commits are often
          # absent (any merge commit already breaks depth 2), the diff errors out,
          # and the import silently skips every post. Full history is cheap here.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @sanity/client + dotenv (minimal, no full Studio install)
        run: |
          mkdir -p /tmp/sanity-import-deps
          cd /tmp/sanity-import-deps
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent @sanity/client@^7 dotenv@^17

      - name: Detect changed post.json files
        id: changed
        run: |
          set -euo pipefail
          PATHSPEC='editorial/posts/*/post.json'
          HEAD_SHA="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ inputs.file }}"
          else
            # Detect from the push range. Deliberately NOT from the merge-base with
            # main: the auto-merge job below moves main, so a merge-base diff would
            # come back empty whenever a branch push has already been merged.
            BASE_SHA="${{ github.event.before }}"
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              # First push of a branch, force-push, or rewritten history: the push
              # range is unusable. Fall back to the merge-base with main, then to
              # the empty tree, so detection degrades to "import more" rather than
              # "import nothing". Imports are idempotent (createOrReplace).
              echo "::warning::Push base ${BASE_SHA} unusable — falling back to the merge-base with main."
              git fetch origin main --quiet || true
              BASE_SHA=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null \
                || git hash-object -t tree /dev/null)
            fi
            FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- "$PATHSPEC")
          fi
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            # Legitimately empty when a push only touched editorial prose or the
            # backlog. A detection *failure* now surfaces as a git error under
            # `set -e` instead of being swallowed, so an empty list here is a
            # genuine no-op rather than the silent skip this workflow used to do.
            echo "::notice::No post.json added or modified in this push — nothing to import."
          else
            echo "::notice::Files to import:"
            echo "$FILES"
          fi

      - name: Import each changed post into Sanity (as draft)
        if: steps.changed.outputs.files != ''
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: i6dkdu7j
          NEXT_PUBLIC_SANITY_DATASET: production
          NODE_PATH: /tmp/sanity-import-deps/node_modules
        run: |
          set -euo pipefail
          if [ -z "${SANITY_WRITE_TOKEN:-}" ]; then
            echo "::error::SANITY_WRITE_TOKEN secret is not set. Add it at https://github.com/AnthonyKulture/Sun-Beach-House/settings/secrets/actions"
            exit 1
          fi
          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "::group::Importing $file"

            # ── 1. Generate main image with Gemini Imagen (best-effort) ──────
            IMAGE_FLAG=""
            IMAGE_PATH=""
            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "  Generating main image with Gemini…"
              if IMAGE_PATH=$(node sbh-cms/scripts/generate-image.js --file="$file" 2>/tmp/img-gen.log); then
                IMAGE_FLAG="--image=${IMAGE_PATH}"
                echo "::notice::Image generated: ${IMAGE_PATH}"
              else
                echo "::warning file=$file::Image generation failed ($(tail -1 /tmp/img-gen.log)) — importing without mainImage"
              fi
            else
              echo "  GEMINI_API_KEY not set — skipping image generation"
            fi

            # ── 2. Import into Sanity ─────────────────────────────────────────
            # First try PUBLISHED import (goes live automatically at publishedAt,
            # thanks to the publishedAt <= now() filter in services/cms.ts).
            # If that fails (e.g. [À VÉRIFIER] markers present), fall back to a
            # DRAFT import so the post at least lands in Studio for human review.
            # shellcheck disable=SC2086
            if node sbh-cms/scripts/import-post.js --file="$file" --publish ${IMAGE_FLAG}; then
              echo "::notice::Published $file to Sanity — goes live on site at its publishedAt date"
            elif node sbh-cms/scripts/import-post.js --file="$file" --force-with-flags ${IMAGE_FLAG}; then
              echo "::warning file=$file::Imported as DRAFT only (validation blocked publish — likely [À VÉRIFIER] markers). Review + Publish in Studio."
            else
              echo "::error file=$file::Import failed for $file"
              FAILED=$((FAILED + 1))
            fi

            # ── 3. Cleanup temp image ─────────────────────────────────────────
            [ -n "${IMAGE_PATH}" ] && rm -f "${IMAGE_PATH}" || true

            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED file(s) failed to import"
            exit 1
          fi

      - name: Summary
        if: always() && steps.changed.outputs.files != ''
        run: |
          {
            echo "## Editorial import summary"
            echo ""
            echo "Files processed:"
            echo '```'
            echo "${{ steps.changed.outputs.files }}"
            echo '```'
            echo ""
            echo "Posts imported with ✓ Published above are fully automatic:"
            echo "- They go live on the site at their \`publishedAt\` date (ISR refresh ≤ 5 min)."
            echo "- No manual step needed."
            echo ""
            echo "Posts imported as DRAFT (warning above) need human review:"
            echo "1. Open https://i6dkdu7j.sanity.studio → Blog / Magazine"
            echo "2. Resolve the [À VÉRIFIER] items listed in \`verificationNotes\`"
            echo "3. Click **Publish**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # Merge the routine's branch into main — only after the import above succeeded.
  #
  # This ran as its own workflow at first, triggered by the same push. Both
  # started at once, and when the merge won the race it moved main out from under
  # the import's file detection, which then found nothing to import. Sequencing
  # them with `needs` removes the race and adds a useful invariant: an article
  # that cannot be imported into Sanity never reaches main.
  #
  # Conflicting hunks (in practice the tracking checklists in
  # editorial/topics-backlog.md) resolve in favor of the branch, which carries the
  # freshest tracking state for its own article.
  #
  # The push to main below uses GITHUB_TOKEN, which deliberately does not
  # re-trigger this workflow — the import already ran, so nothing imports twice.
  # ────────────────────────────────────────────────────────────────────────────
  auto-merge:
    needs: import
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-merge-editorial-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the branch only touches editorial content
        id: guard
        run: |
          set -euo pipefail
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "::notice::Branch has no changes vs main — nothing to merge."
            echo "safe=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files changed vs main:"
          echo "$CHANGED"
          NON_EDITORIAL=$(echo "$CHANGED" | grep -v '^editorial/' || true)
          if [ -n "$NON_EDITORIAL" ]; then
            echo "::notice::Branch touches non-editorial files — auto-merge skipped, open a PR for review:"
            echo "$NON_EDITORIAL"
            echo "safe=no" >> "$GITHUB_OUTPUT"
          else
            echo "safe=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into main (favor branch on conflicts)
        if: steps.guard.outputs.safe == 'yes'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          HEAD_SHA="${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            if git merge --no-ff -X theirs "$HEAD_SHA" \
                 -m "auto-merge(editorial): ${BRANCH} → main"; then
              if git push origin main; then
                echo "::notice::Auto-merged ${BRANCH} into main (attempt ${attempt})."
                exit 0
              fi
              echo "Push race detected, retrying (${attempt}/3)…"
              sleep 5
            else
              git merge --abort || true
              echo "::error::Merge of ${BRANCH} into main failed even with -X theirs. Manual merge required."
              exit 1
            fi
          done
          echo "::error::Could not push main after 3 attempts (concurrent pushes). Re-run this workflow."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Auto-merge editorial"
            echo ""
            case "${{ steps.guard.outputs.safe }}" in
              yes)  echo "✅ Branch \`${GITHUB_REF_NAME}\` merged into \`main\` after a successful import." ;;
              no)   echo "⚠️ Branch touches non-editorial files — merge it via a normal PR." ;;
              skip) echo "ℹ️ No changes vs main — nothing to do." ;;
              *)    echo "❓ Guard step did not run." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
